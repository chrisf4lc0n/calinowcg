# Reusable: runs one Playwright project shard against an isolated mock CalDAV
# stack (vite middleware + the fixture DAV server). Each shard job gets its
# own runner, hence its own vite/mock process: the suite's ~515 tests keep
# the parallel load on one shared mock server modest and wall time per job
# ~9m instead of ~25m (see the workers note in playwright.config.ts).
# Callers pass a browser project name plus shard index/total. The
# live-CALDAV specs self-skip without credentials, so no secrets are needed
# here.
name: E2E (reusable)

on:
  workflow_call:
    inputs:
      browser:
        required: true
        type: string
      shard:
        required: true
        type: number
      shards:
        required: true
        type: number

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ inputs.browser }} shard ${{ inputs.shard }}/${{ inputs.shards }}
    runs-on: ubuntu-latest
    # One quarter of ~125 spec files on two workers; a cold runner plus
    # browser install fits inside this. A run that blows past it is hung.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        # version auto-read from packageManager field

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keyed on the lockfile: a Playwright version bump (new browser build)
      # misses the cache instead of restoring a stale executable.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ inputs.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ms-playwright-${{ inputs.browser }}-

      - name: Install browser
        run: pnpm exec playwright install --with-deps ${{ inputs.browser }}

      # CI=true (set by Actions) switches the config to its CI profile:
      # 2 retries, forbidOnly, GitHub-annotated reporter.
      - name: Run e2e
        run: pnpm test:e2e --project=${{ inputs.browser }} --shard=${{ inputs.shard }}/${{ inputs.shards }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ inputs.browser }}-${{ inputs.shard }}
          path: |
            playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
