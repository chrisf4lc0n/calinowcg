# Reusable: runs one Playwright project against the in-repo mock CalDAV stack
# (vite middleware + the fixture DAV server). Callers pass a browser project
# name. The live-CALDAV specs self-skip without credentials, so no secrets
# are needed here.
name: E2E (reusable)

on:
  workflow_call:
    inputs:
      browser:
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ inputs.browser }}
    runs-on: ubuntu-latest
    # The suite is ~125 spec files on two workers; a cold runner plus browser
    # install fits inside this. A run that blows past it is hung, not slow.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        # version auto-read from packageManager field

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keyed on the lockfile: a Playwright version bump (new browser build)
      # misses the cache instead of restoring a stale executable.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ inputs.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ms-playwright-${{ inputs.browser }}-

      - name: Install browser
        run: pnpm exec playwright install --with-deps ${{ inputs.browser }}

      # CI=true (set by Actions) switches the config to its CI profile:
      # 2 retries, forbidOnly, GitHub-annotated reporter.
      - name: Run e2e
        run: pnpm test:e2e --project=${{ inputs.browser }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ inputs.browser }}
          path: |
            playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
