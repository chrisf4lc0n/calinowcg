# Calino with a config made by scripts/calino-config.mjs mounted read-only.
# Pulls the prebuilt image; nothing is built here.
#
# Use it as /opt/calino/docker-compose.yml with an .env next to it, or in
# Portainer (Stacks → Add stack: paste it, or point the stack at this file in
# the repository). See docs/DEPLOY_WITH_GENERATED_CONFIG.md.
#
# Environment variables:
#   CALINO_CONFIG_FILE  (required) host path of calino.config.json,
#                       e.g. /opt/calino/calino.config.json
#   CALINO_IMAGE        default ghcr.io/chrisf4lc0n/calinowcg:latest; a sha-… tag
#                       pins one build, calino:local uses one you built
#   CALINO_PORT         host port, default 8080
#
# The image keeps the mounted config private by default. This stack sets
# CALINO_CONFIG_ALLOW_PUBLIC=true because the generator's file is already
# encrypted field by field with the master password. To also require a
# sign-in before the file is served, set CALINO_CONFIG_ALLOW_PUBLIC=false
# plus CALINO_CONFIG_AUTH_USER and CALINO_CONFIG_AUTH_HASH (see
# docs/DEPLOY_WITH_GENERATED_CONFIG.md). For one config per Calino user,
# mount a directory at /calino instead and see docs/SELF_HOSTED_CONFIG.md.
#
# To change accounts or calendars: re-run the generator on the same file and
# reload the page. The file is read on every load; no restart is needed.
services:
  calino:
    image: ${CALINO_IMAGE:-ghcr.io/chrisf4lc0n/calinowcg:latest}
    ports:
      - "${CALINO_PORT:-8080}:8080"
    environment:
      CALINO_CONFIG_ALLOW_PUBLIC: ${CALINO_CONFIG_ALLOW_PUBLIC:-true}
      CALINO_CONFIG_PER_USER: ${CALINO_CONFIG_PER_USER:-false}
      CALINO_CONFIG_AUTH_USER: ${CALINO_CONFIG_AUTH_USER:-}
      CALINO_CONFIG_AUTH_HASH: ${CALINO_CONFIG_AUTH_HASH:-}
    volumes:
      - ${CALINO_CONFIG_FILE:?Set CALINO_CONFIG_FILE to the host path of calino.config.json}:/calino/calino.config.json:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 128m
    memswap_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
